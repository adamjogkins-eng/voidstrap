<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoidStrap | Nuclear</title>
    <style>
        body {
            background-color: #0d0221;
            color: #ffffff;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            padding: 30px;
            border-radius: 25px;
            background: rgba(25, 10, 50, 0.9);
            border: 1px solid #4a008f;
            box-shadow: 0 0 40px rgba(123, 44, 191, 0.3);
            width: 80%;
            max-width: 350px;
        }
        .logo {
            font-size: 70px;
            color: #9d4edd;
            text-shadow: 0 0 15px #7b2cbf;
            margin-bottom: 10px;
        }
        h1 { font-size: 24px; margin: 10px 0; letter-spacing: 1px; }
        p { color: #b79ced; font-size: 14px; margin-bottom: 30px; }
        
        .btn {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white;
            padding: 18px 0;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            display: block;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: scale(0.96);
            background: #9d4edd;
        }
        .info {
            margin-top: 25px;
            font-size: 11px;
            color: #5a5a7a;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">𝔳</div>
        <h1>VOIDSTRAP</h1>
        <p>Nuclear V8 Edition</p>
        
        <a href="itms-services://?action=download-manifest&url=https://adamjogkins-eng.github.io/voidstrap/install.plist" class="btn">
            INSTALL APP
        </a>

        <div class="info">
            Must open in <b>Safari</b><br>
            Signed IPA Required
        </div>
    </div>

</body>
</html>
