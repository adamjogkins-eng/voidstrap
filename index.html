<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoidStrap | Nuclear</title>
    <style>
        body {
            background-color: #0d0221;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }
        .card {
            padding: 40px 20px;
            border-radius: 30px;
            background: rgba(20, 10, 40, 0.95);
            border: 1px solid #4a008f;
            box-shadow: 0 0 50px rgba(123, 44, 191, 0.4);
            width: 85%;
            max-width: 380px;
        }
        .logo {
            font-size: 80px;
            color: #9d4edd;
            text-shadow: 0 0 20px #7b2cbf;
            margin-bottom: 15px;
            font-weight: bold;
        }
        h1 { 
            font-size: 28px; 
            margin: 10px 0; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        p { 
            color: #b79ced; 
            font-size: 15px; 
            margin-bottom: 35px;
            opacity: 0.8;
        }
        .btn {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white;
            padding: 20px 0;
            text-decoration: none;
            border-radius: 18px;
            font-weight: bold;
            font-size: 20px;
            display: block;
            width: 100%;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .btn:active {
            transform: scale(0.95);
            background: #9d4edd;
        }
        .instructions {
            margin-top: 30px;
            font-size: 12px;
            color: #6a6a8a;
            line-height: 1.6;
        }
        .safari-only {
            color: #ff9e00;
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">𝔳</div>
        <h1>VOIDSTRAP</h1>
        <p>Nuclear V8 Optimization</p>
        
        <a href="itms-services://?action=download-manifest&url=https://adamjogkins-eng.github.io/voidstrap/install.plist" class="btn">
            INSTALL NOW
        </a>

        <div class="instructions">
            <span class="safari-only">USE SAFARI BROWSER</span>
            Once installed, go to Settings > General > <br>
            VPN & Device Management to Trust the app.
        </div>
    </div>

</body>
</html>
